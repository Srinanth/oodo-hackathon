services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-subscription_db}
      POSTGRES_USER: ${DB_USER:-subscription_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-dev-only}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - subscription_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-subscription_app} -d ${DB_NAME:-subscription_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  subscription_postgres_data:
